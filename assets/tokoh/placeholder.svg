<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Mystery figure placeholder silhouette">
  <defs>
    <radialGradient id="mystery-aura" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#d94dff" stop-opacity=".28"/>
      <stop offset="58%" stop-color="#39e7ff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0b0820" stop-opacity="0"/>
    </radialGradient>
    <filter id="mystery-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="1" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="3" fill="#39e7ff" opacity=".09"/>
