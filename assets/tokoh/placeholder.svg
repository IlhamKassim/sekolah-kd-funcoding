  </defs>

  <rect width="320" height="320" rx="12" fill="#0b0820"/>
  <rect x="12" y="12" width="296" height="296" rx="8" fill="url(#mystery-aura)" stroke="#39e7ff" stroke-width="3" filter="url(#mystery-glow)"/>
  <rect x="24" y="24" width="272" height="272" rx="4" fill="url(#scanlines)"/>

  <path d="M40 72h24V48h24V32h144v16h24v24h24M40 248h24v24h24v16h144v-16h24v-24h24"
